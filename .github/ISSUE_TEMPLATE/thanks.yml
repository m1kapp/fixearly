name: 고쳤어요 (사내 적용 신고)
description: fixearly 가 잡은 걸 비공개 저장소에서 고쳤다면 숫자만 남겨 주세요.
title: "고쳤어요: "
labels: ["thanks-pending"]
body:
  - type: markdown
    attributes:
      value: |
        **저장소명·파일 경로·버그 설명은 쓰지 마세요.** 회사(org) 이름은 아래에서 허락을 체크했을 때만 표시하고, 아니면 업종으로만 씁니다.
        메인테이너가 확인하고 `thanks` 라벨을 붙인 신고만 랜딩에 "자기 신고"로 표시됩니다. OSS 머지 수에는 더하지 않습니다.
  - type: textarea
    id: axes
    attributes:
      label: 고친 축과 건수
      description: "한 줄에 하나씩. `fixearly --sweep` 이 해소를 찾으면 이 칸을 채운 링크를 출력합니다."
      placeholder: |
        같은 식 두 번 비교 2
        독립 await 직렬화 1
    validations:
      required: true
  - type: dropdown
    id: industry
    attributes:
      label: 업종
      options: [B2B SaaS, 커머스, 핀테크, 게임, 미디어·콘텐츠, 공공·교육, 개발 도구, 기타]
    validations:
      required: true
  - type: dropdown
    id: stack
    attributes:
      label: 스택
      options: [TypeScript · Node, TypeScript · React, JavaScript, Python, 기타]
    validations:
      required: true
  - type: input
    id: metric_name
    attributes:
      label: 대표 성과 — 지표 (선택)
      placeholder: "그래프 검증 5,000노드"
  - type: input
    id: metric_before
    attributes:
      label: 대표 성과 — 전 (선택)
      placeholder: "519.51ms"
  - type: input
    id: metric_after
    attributes:
      label: 대표 성과 — 후 (선택)
      placeholder: "6.41ms"
  - type: dropdown
    id: verify
    attributes:
      label: 검증 방법
      description: 숫자는 방법이 있을 때만 크게 표시합니다.
      options: [재현 테스트 (수정 전 실패 · 후 통과), 벤치마크, 운영 지표, 없음]
    validations:
      required: true
  - type: textarea
    id: metric
    attributes:
      label: 그 밖의 성과 (선택)
      description: "한 줄에 하나씩. 지표 · 전→후 · 방법."
      placeholder: "p50 응답 2.1s → 0.4s · 스테이징 부하 테스트 10분"
  - type: input
    id: note
    attributes:
      label: 한 줄 메모 (선택)
      placeholder: "결제 화면 할인 표시가 몇 년째 안 뜨던 걸 찾았어요"
  - type: input
    id: name
    attributes:
      label: 표시 이름 (선택 · 비우면 익명)
  - type: input
    id: org
    attributes:
      label: 회사(org) 이름 (선택)
      description: 아래 허락을 체크하지 않으면 표시하지 않습니다.
  - type: checkboxes
    id: org_consent
    attributes:
      label: 회사 이름을 넣었다면
      options:
        - label: 회사 이름을 공개해도 된다는 허락을 받았습니다
  - type: textarea
    id: snippet
    attributes:
      label: 고치기 전·후 코드 조각 (선택)
      description: 이름을 바꾼 몇 줄이면 됩니다. 아래 두 칸을 모두 체크했을 때만 공개합니다.
      render: ts
  - type: checkboxes
    id: consent
    attributes:
      label: 코드 조각을 넣었다면
      options:
        - label: 공개해도 되는 코드입니다 (회사 허락을 받았거나 공개해도 되는 수준으로 바꿨습니다)
        - label: 이 조각을 fixearly 저장소의 MIT 라이선스로 공개하는 데 동의합니다
