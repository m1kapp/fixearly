<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="fixearly">
  <!-- 등급 분포 막대 모티프. 처음엔 파란 라운드 사각형 + 흰 'f' 로 만들었는데
       Facebook 아이콘과 구분이 안 됐다. 이 형태는 16px 로 줄여도 "작은 차트"로
       읽히고, 색이 페이지의 등급 팔레트(S 초록 → E 빨강)와 같다. -->
  <rect width="64" height="64" rx="14" fill="#0f1723"/>
  <rect x="14" y="17" width="36" height="8" rx="4" fill="#0f7a63"/>
  <rect x="14" y="30" width="26" height="8" rx="4" fill="#7d8a2c"/>
  <rect x="14" y="43" width="14" height="8" rx="4" fill="#bf4a38"/>
</svg>
